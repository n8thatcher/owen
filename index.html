<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Owen's Code!</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      display: flex;
      height: 100vh;
      background: #1a1a2e;
    }

    nav {
      width: 140px;
      min-width: 140px;
      background: #12122a;
      display: flex;
      flex-direction: column;
      padding: 24px 0;
      gap: 4px;
      border-right: 2px solid #2e2e55;
    }

    nav .nav-title {
      color: #7c83f7;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 0 18px 16px;
      border-bottom: 1px solid #2e2e55;
      margin-bottom: 8px;
    }

    nav a {
      color: #9099cc;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 0 8px 8px 0;
      font-size: 15px;
      font-weight: 500;
      margin-right: 8px;
      transition: background 0.15s, color 0.15s;
    }

    nav a:hover {
      background: #2a2a4e;
      color: #c0c8ff;
    }

    nav a.active {
      background: #7c83f7;
      color: white;
    }

    iframe {
      flex: 1;
      border: none;
      height: 100%;
    }
  </style>
</head>

<body>
  <nav>
    <div class="nav-title">Owen</div>
    <a href="#" id="link-owen1" class="active" onclick="loadPage('pages/owen1.html', this)">Owen 1</a>
    <a href="#" id="link-owen2" onclick="loadPage('pages/owen2.html', this)">Owen 2</a>
  </nav>
  <iframe id="content" src="pages/owen1.html"></iframe>

  <script>
    function loadPage(url, linkEl) {
      document.getElementById('content').src = url;
      document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
      linkEl.classList.add('active');
    }
  </script>
</body>

</html>
